name: CI/CD Pipeline - Maceió Turismo

on:
  # Dispara automaticamente quando ocorre push ou merge para a branch main
  push:
    branches:
      - main
  # Dispara verificações de integração contínua (CI) em Pull Requests para a main
  pull_request:
    branches:
      - main
  # Permite acionamento manual direto pela aba Actions do GitHub
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. ETAPA DE CI: Análise Estática e Validação Sintática
  # ============================================================================
  lint-and-syntax:
    name: 🔍 Lint & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependências de lint
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🧪 Validar compilação sintática
        run: |
          python -m compileall -q app.py config.py database.py seed_data.py tests/

      - name: 🔎 Executar Flake8 (Erros Críticos de Sintaxe e Nomes Indefinidos)
        run: |
          # Interrompe o build se houver erros de sintaxe (E9) ou variáveis indefinidas (F63, F7, F82)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__

      - name: 📋 Executar Flake8 (Complexidade e Estilo)
        run: |
          # Relatório informativo de boas práticas sem quebrar a pipeline
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=.venv,__pycache__

  # ============================================================================
  # 2. ETAPA DE CI: Auditoria de Segurança (OWASP Top 10 / SAST)
  # ============================================================================
  security-audit:
    name: 🛡️ Security Audit (OWASP & Dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar ferramentas de segurança
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: 🛡️ Análise Estática SAST com Bandit (Foco OWASP Top 10)
        run: |
          # Verifica injeções, configurações inseguras e pontos críticos
          bandit -r . -x ./.venv,./tests -ll -v

      - name: 🔐 Auditoria de Vulnerabilidades em Dependências com pip-audit
        run: |
          # Audita dependências listadas no requirements.txt contra bases de vulnerabilidades conhecidas (CVEs)
          pip-audit -r requirements.txt

  # ============================================================================
  # 3. ETAPA DE CI: Execução da Suíte de Testes Automatizados
  # ============================================================================
  test:
    name: 🧪 Testes Automatizados (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Instalar dependências da aplicação
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Executar Suíte de Testes Pytest
        env:
          DEFAULT_ADMIN_USER: admin
          DEFAULT_ADMIN_PASS: TestSecureCiPass#2025!
          SECRET_KEY: ci-test-secret-key-32-characters-min!!
        run: |
          python -m pytest tests/test_app.py -v --junitxml=junit-results-${{ matrix.python-version }}.xml

      - name: 📊 Publicar relatório de testes JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: junit-results-${{ matrix.python-version }}.xml
          retention-days: 7

  # ============================================================================
  # 4. ETAPA DE CD: Empacotamento de Artefato de Produção
  # (Executado EXCLUSIVAMENTE após merge/push para a branch main)
  # ============================================================================
  build-and-package:
    name: 📦 Empacotamento de Artefato (Release)
    needs: [lint-and-syntax, security-audit, test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🏗️ Preparar pacote de distribuição para produção
        run: |
          mkdir -p dist
          # Cria arquivo tar.gz com arquivos essenciais, excluindo testes, venv e caches
          tar --exclude='./.git' \
              --exclude='./.venv' \
              --exclude='./__pycache__' \
              --exclude='*/__pycache__' \
              --exclude='./tests' \
              --exclude='./.pytest_cache' \
              --exclude='./dist' \
              -czvf dist/maceio-turismo-${{ github.sha }}.tar.gz .

          cd dist
          sha256sum maceio-turismo-${{ github.sha }}.tar.gz > checksums.sha256
          echo "SHA256 Checksum:"
          cat checksums.sha256

      - name: 📤 Publicar Artefato de Produção no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: production-bundle-${{ github.sha }}
          path: |
            dist/maceio-turismo-${{ github.sha }}.tar.gz
            dist/checksums.sha256
          retention-days: 30

  # ============================================================================
  # 5. ETAPA DE CD: Deploy Contínuo no Servidor de Produção (Oracle Cloud / VM)
  # (Executado EXCLUSIVAMENTE após merge/push para a branch main)
  # ============================================================================
  deploy:
    name: 🚀 Deploy Contínuo (Produção)
    needs: [build-and-package]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🔍 Verificar credenciais de SSH para Deploy
        id: check-secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          echo "=== DIAGNÓSTICO DE CREDENCIAIS ==="
          if [ -z "$VM_HOST" ]; then
            echo "❌ VM_HOST está VAZIA!"
          else
            echo "✅ VM_HOST está preenchida."
          fi

          if [ -z "$VM_SSH_KEY" ]; then
            echo "❌ VM_SSH_KEY está VAZIA!"
          else
            echo "✅ VM_SSH_KEY está preenchida."
            FIRST_LINE=$(printf "%s" "$VM_SSH_KEY" | head -n 1)
            LAST_LINE=$(printf "%s" "$VM_SSH_KEY" | tail -n 1)
            echo "📋 Formato da chave detectado:"
            echo "   Primeira linha: $FIRST_LINE"
            echo "   Última linha:   $LAST_LINE"
          fi

          if [ -n "$VM_HOST" ] && [ -n "$VM_SSH_KEY" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "🚀 Credenciais válidas. Prosseguindo para o deploy..."
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Credenciais de SSH não cadastradas em GitHub Secrets."
          fi

      - name: 🚀 Executar Deploy via SSH na Máquina Virtual
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER || 'deployer' }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "Conectado ao servidor de produção como $(whoami)."

            # 1. Restaurar a chave original do usuário ubuntu
            echo "🔑 Restaurando a chave original do usuário ubuntu..."
            USER_KEY="ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQD_CHAVE_PUBLICA_EXEMPLO_REDACTED"
            echo "$USER_KEY" | sudo tee -a /home/ubuntu/.ssh/authorized_keys > /dev/null
            sudo sort -u /home/ubuntu/.ssh/authorized_keys -o /home/ubuntu/.ssh/authorized_keys 2>/dev/null || true
            sudo chown ubuntu:ubuntu /home/ubuntu/.ssh/authorized_keys
            sudo chmod 600 /home/ubuntu/.ssh/authorized_keys
            echo "✅ Chave SSH do usuário ubuntu restaurada com sucesso!"

            # 2. Configurar safe.directory e remote HTTPS
            APP_DIR="${{ secrets.VM_APP_DIR || '/home/ubuntu/Projeto_Aplicado' }}"
            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true
            sudo -u ubuntu git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true
            cd "$APP_DIR"
            git remote set-url origin https://github.com/AdrianoS96/Projeto_Aplicado.git 2>/dev/null || true

            # 3. Executar o deploy
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh

      - name: ℹ️ Orientações de Configuração (Modo Standby)
        if: steps.check-secrets.outputs.has_secrets == 'false'
        run: |
          echo "==========================================================================="
          echo "💡 CD / DEPLOY AUTOMÁTICO EM STANDBY:"
          echo "O pipeline foi executado com sucesso e o artefato de release foi gerado!"
          echo ""
          echo "Para ativar o deploy automatizado direto na sua VM Oracle Cloud (ou outro host),"
          echo "adicione as seguintes Secrets em seu repositório GitHub:"
          echo "  (Settings -> Secrets and variables -> Actions -> New repository secret):"
          echo ""
          echo "  • VM_HOST: IP público ou domínio da máquina virtual"
          echo "  • VM_USER: Usuário SSH da VM (ex: ubuntu)"
          echo "  • VM_SSH_KEY: Conteúdo da sua chave privada SSH (~/.ssh/id_rsa ou id_ed25519)"
          echo "  • VM_SSH_PORT: (Opcional, padrão 22)"
          echo "  • VM_APP_DIR: (Opcional, padrão /home/ubuntu/Projeto_Aplicado)"
          echo "==========================================================================="
