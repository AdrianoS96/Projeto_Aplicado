<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky-tv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="60%" stop-color="#64b5f6"/>
      <stop offset="100%" stop-color="#bbdefb"/>
    </linearGradient>
    <linearGradient id="sea-tv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00897b"/>
      <stop offset="100%" stop-color="#004d40"/>
    </linearGradient>
  </defs>
  <rect width="800" height="280" fill="url(#sky-tv)"/>
  <rect y="260" width="800" height="120" fill="url(#sea-tv)"/>
  <!-- Calçadão de Pajuçara -->
  <rect y="360" width="800" height="140" fill="#cfd8dc"/>
  <!-- Ondas do calçadão típico alagoano -->
  <path d="M 0 380 Q 50 365 100 380 T 200 380 T 300 380 T 400 380 T 500 380 T 600 380 T 700 380 T 800 380" stroke="#37474f" stroke-width="4" fill="none"/>
  <path d="M 0 410 Q 50 395 100 410 T 200 410 T 300 410 T 400 410 T 500 410 T 600 410 T 700 410 T 800 410" stroke="#37474f" stroke-width="4" fill="none"/>
  <!-- Monumento Niemeyer: Estrutura Escultural de Concreto Branco e Curvas -->
  <g transform="translate(380, 220)">
    <!-- Base -->
    <rect x="-160" y="130" width="320" height="15" fill="#eceff1" rx="4"/>
    <!-- Escultura em curva Niemeyer -->
    <path d="M -140 130 C -80 -20 80 -20 140 130 C 100 40 -100 40 -140 130 Z" fill="#ffffff"/>
    <path d="M -90 130 C -50 20 50 20 90 130 Z" fill="#90caf9" opacity="0.4"/>
    <!-- Cúpula memorial semicircular -->
    <ellipse cx="0" cy="130" rx="60" ry="40" fill="#f5f5f5"/>
    <circle cx="0" cy="95" r="8" fill="#1e88e5"/>
    <line x1="0" y1="95" x2="0" y2="40" stroke="#1565c0" stroke-width="3"/>
  </g>
  <rect x="20" y="20" width="250" height="40" rx="8" fill="#0d47a1" opacity="0.8"/>
  <text x="35" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Memorial Teotônio Vilela</text>
</svg>
