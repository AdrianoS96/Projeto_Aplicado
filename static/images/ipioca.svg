<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky-ip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="60%" stop-color="#b2ebf2"/>
      <stop offset="100%" stop-color="#e0f7fa"/>
    </linearGradient>
    <linearGradient id="sea-ip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1de9b6"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="sand-ip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fffde7"/>
      <stop offset="100%" stop-color="#ffe082"/>
    </linearGradient>
  </defs>
  <rect width="800" height="260" fill="url(#sky-ip)"/>
  <circle cx="650" cy="80" r="40" fill="#fffde7" opacity="0.9"/>
  <!-- Mar caribenho de Ipioca -->
  <rect y="230" width="800" height="170" fill="url(#sea-ip)"/>
  <!-- Faixas de ondas suaves e água translúcida -->
  <path d="M0 250 Q 200 240 400 248 T 800 250 L 800 290 L 0 290 Z" fill="#64ffda" opacity="0.5"/>
  <path d="M0 290 Q 250 280 500 288 T 800 290 L 800 340 L 0 340 Z" fill="#a7ffeb" opacity="0.4"/>
  <!-- Areias brancas -->
  <path d="M0 360 Q 400 340 800 365 L 800 500 L 0 500 Z" fill="url(#sand-ip)"/>
  <!-- Coqueirais do Litoral Norte -->
  <g transform="translate(620, 180)">
    <path d="M 40 280 Q 20 160 0 60" stroke="#5d4037" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 0 60 Q -40 20 -70 40" stroke="#1b5e20" stroke-width="6" fill="none"/>
    <path d="M 0 60 Q -20 0 -40 -30" stroke="#2e7d32" stroke-width="6" fill="none"/>
    <path d="M 0 60 Q 30 0 60 -10" stroke="#388e3c" stroke-width="6" fill="none"/>
    <path d="M 0 60 Q 50 40 70 70" stroke="#1b5e20" stroke-width="6" fill="none"/>
  </g>
  <g transform="translate(700, 220)">
    <path d="M 30 240 Q 50 140 30 60" stroke="#4e342e" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 30 60 Q -10 30 -30 50" stroke="#2e7d32" stroke-width="5" fill="none"/>
    <path d="M 30 60 Q 10 0 0 -20" stroke="#388e3c" stroke-width="5" fill="none"/>
    <path d="M 30 60 Q 60 10 80 10" stroke="#43a047" stroke-width="5" fill="none"/>
  </g>
  <rect x="20" y="20" width="220" height="40" rx="8" fill="#00363a" opacity="0.75"/>
  <text x="35" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Praia de Ipioca</text>
</svg>
