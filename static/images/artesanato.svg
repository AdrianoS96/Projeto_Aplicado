<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="50%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ffcc80"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg-art)"/>
  <!-- Padrão Geométrico do Bordado Filé Alagoano -->
  <g opacity="0.85">
    <!-- Linhas da rede de pesca base do filé -->
    <path d="M 50 50 L 750 450 M 150 50 L 750 350 M 50 150 L 650 450 M 250 50 L 750 250 M 50 250 L 550 450 M 350 50 L 750 150 M 50 350 L 450 450" stroke="#ffb74d" stroke-width="2"/>
    <path d="M 750 50 L 50 450 M 650 50 L 50 350 M 750 150 L 150 450 M 550 50 L 50 250 M 750 250 L 250 450 M 450 50 L 50 150 M 750 350 L 350 450" stroke="#ffb74d" stroke-width="2"/>
  </g>
  <!-- Flores e Mandalas coloridas do Filé -->
  <g transform="translate(400, 260)">
    <!-- Camada Externa -->
    <circle cx="0" cy="0" r="140" fill="#e91e63" opacity="0.85"/>
    <circle cx="0" cy="0" r="115" fill="#9c27b0" opacity="0.85"/>
    <circle cx="0" cy="0" r="90" fill="#00bcd4" opacity="0.85"/>
    <circle cx="0" cy="0" r="65" fill="#4caf50" opacity="0.9"/>
    <circle cx="0" cy="0" r="40" fill="#ffeb3b" opacity="0.95"/>
    <circle cx="0" cy="0" r="20" fill="#ff5722"/>
    <!-- Pétalas em cruz -->
    <path d="M -130 0 L 130 0 M 0 -130 L 0 130" stroke="#ffffff" stroke-width="4"/>
    <path d="M -90 -90 L 90 90 M -90 90 L 90 -90" stroke="#ffffff" stroke-width="4"/>
  </g>
  <g transform="translate(180, 200)">
    <circle cx="0" cy="0" r="65" fill="#00bcd4" opacity="0.85"/>
    <circle cx="0" cy="0" r="45" fill="#ff9800" opacity="0.9"/>
    <circle cx="0" cy="0" r="25" fill="#ffffff"/>
  </g>
  <g transform="translate(620, 200)">
    <circle cx="0" cy="0" r="65" fill="#4caf50" opacity="0.85"/>
    <circle cx="0" cy="0" r="45" fill="#e91e63" opacity="0.9"/>
    <circle cx="0" cy="0" r="25" fill="#ffffff"/>
  </g>
  <rect x="20" y="20" width="250" height="40" rx="8" fill="#e65100" opacity="0.85"/>
  <text x="35" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Pavilhão do Artesanato</text>
</svg>
