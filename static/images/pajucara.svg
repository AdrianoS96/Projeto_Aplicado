<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#e0f7fa"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="50%" stop-color="#0097a7"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffe082"/>
    </linearGradient>
  </defs>
  <!-- Céu e Sol -->
  <rect width="800" height="300" fill="url(#sky)"/>
  <circle cx="680" cy="90" r="50" fill="#fff9c4" opacity="0.9"/>
  <circle cx="680" cy="90" r="70" fill="#fff59d" opacity="0.4"/>
  <!-- Nuvens leves -->
  <path d="M120 80 q25 -25 55 0 q25 -15 45 10 q20 0 25 15 h-130 z" fill="#ffffff" opacity="0.8"/>
  <path d="M420 110 q20 -20 45 0 q20 -10 35 10 h-90 z" fill="#ffffff" opacity="0.7"/>
  <!-- Mar Esmeralda -->
  <rect y="240" width="800" height="200" fill="url(#sea)"/>
  <path d="M0 245 Q 200 240 400 245 T 800 245 L 800 270 L 0 270 Z" fill="#26c6da" opacity="0.6"/>
  <!-- Corais ao fundo das piscinas -->
  <ellipse cx="250" cy="285" rx="140" ry="20" fill="#00838f" opacity="0.7"/>
  <ellipse cx="580" cy="295" rx="110" ry="18" fill="#00838f" opacity="0.6"/>
  <!-- Jangada Tradicional Alagoana -->
  <g transform="translate(320, 210)">
    <!-- Casco de troncos rústicos -->
    <path d="M40 90 L 160 90 L 145 105 L 55 105 Z" fill="#8d6e63"/>
    <line x1="35" y1="92" x2="165" y2="92" stroke="#5d4037" stroke-width="4"/>
    <!-- Mastro -->
    <line x1="100" y1="92" x2="100" y2="15" stroke="#4e342e" stroke-width="4"/>
    <!-- Vela Triangular Branca e Laranja -->
    <polygon points="100,15 155,75 100,85" fill="#ff7043" opacity="0.95"/>
    <polygon points="100,25 70,80 100,85" fill="#ffffff" opacity="0.95"/>
    <line x1="100" y1="15" x2="155" y2="75" stroke="#d84315" stroke-width="2"/>
    <!-- Reflexo na água -->
    <ellipse cx="100" cy="112" rx="50" ry="6" fill="#004d40" opacity="0.3"/>
  </g>
  <!-- Faixa de Areia -->
  <path d="M0 420 Q 400 390 800 420 L 800 500 L 0 500 Z" fill="url(#sand)"/>
  <!-- Coqueiro decorativo -->
  <g transform="translate(40, 320)">
    <path d="M30 180 Q 50 80 10 0" stroke="#795548" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M10 0 Q -30 -20 -60 10" stroke="#2e7d32" stroke-width="6" fill="none"/>
    <path d="M10 0 Q -10 -40 -30 -60" stroke="#388e3c" stroke-width="6" fill="none"/>
    <path d="M10 0 Q 30 -50 60 -50" stroke="#43a047" stroke-width="6" fill="none"/>
    <path d="M10 0 Q 50 -20 80 0" stroke="#2e7d32" stroke-width="6" fill="none"/>
  </g>
  <!-- Legenda artística -->
  <rect x="20" y="20" width="260" height="40" rx="8" fill="#00363a" opacity="0.75"/>
  <text x="35" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Piscinas Naturais de Pajuçara</text>
</svg>
