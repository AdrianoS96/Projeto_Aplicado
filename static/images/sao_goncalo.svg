<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky-sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="40%" stop-color="#ffb74d"/>
      <stop offset="80%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#80deea"/>
    </linearGradient>
    <linearGradient id="bay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00838f"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
  </defs>
  <!-- Pôr do Sol de Maceió -->
  <rect width="800" height="270" fill="url(#sky-sg)"/>
  <circle cx="400" cy="180" r="45" fill="#fff9c4" opacity="0.9"/>
  <!-- Enseada de Jaraguá / Porto -->
  <rect y="270" width="800" height="230" fill="url(#bay)"/>
  <!-- Quebra-mar do Porto de Maceió -->
  <path d="M 450 310 L 680 300 L 690 315 L 460 325 Z" fill="#455a64"/>
  <!-- Navio no porto distante -->
  <rect x="530" y="288" width="50" height="12" fill="#37474f"/>
  <polygon points="580,288 595,294 580,300" fill="#37474f"/>
  <line x1="550" y1="288" x2="550" y2="275" stroke="#ffffff" stroke-width="2"/>
  <!-- Telhados Coloniais do Centro e Jaraguá abaixo -->
  <g fill="#bf360c" opacity="0.9">
    <polygon points="100,340 140,320 180,340"/>
    <polygon points="170,345 220,315 260,345"/>
    <polygon points="250,340 290,325 330,340"/>
    <polygon points="320,350 370,320 410,350"/>
  </g>
  <!-- Guarda-corpo do Mirante no Primeiro Plano -->
  <path d="M 0 380 Q 400 350 800 380 L 800 500 L 0 500 Z" fill="#37474f"/>
  <line x1="0" y1="390" x2="800" y2="390" stroke="#78909c" stroke-width="8"/>
  <g stroke="#90a4ae" stroke-width="5">
    <line x1="80" y1="390" x2="80" y2="500"/>
    <line x1="200" y1="390" x2="200" y2="500"/>
    <line x1="320" y1="390" x2="320" y2="500"/>
    <line x1="440" y1="390" x2="440" y2="500"/>
    <line x1="560" y1="390" x2="560" y2="500"/>
    <line x1="680" y1="390" x2="680" y2="500"/>
  </g>
  <rect x="20" y="20" width="240" height="40" rx="8" fill="#263238" opacity="0.8"/>
  <text x="35" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Mirante de São Gonçalo</text>
</svg>
